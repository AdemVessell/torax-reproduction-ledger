name: x86 reproduction (E005)

# Runs the ledger's x86_64 legs on GitHub-hosted runners. Expectations are sealed in
# evidence/E005/PREREGISTRATION.md (+ PREREG_ADDENDUM_1.md), committed before the runs.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/x86-reproduction.yml
      - harness/**
      - evidence/E005/PREREGISTRATION.md
      - evidence/E005/PREREG_ADDENDUM_*.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x1x3:
    name: X1 flagship + X3 heat-off + E001 controls
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Run X1 and X3
        run: bash harness/ci_x86.sh x1x3
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e005-x1x3
          path: evidence/E005/ci/x1x3/
          retention-days: 90

  x2:
    name: X2 upstream sim suite, release-era deps
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Run X2
        run: bash harness/ci_x86.sh x2
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e005-x2
          path: evidence/E005/ci/x2/
          retention-days: 90

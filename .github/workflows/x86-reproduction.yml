name: x86 reproduction (E005)

# Runs the ledger's x86_64 legs on a GitHub-hosted runner. Expectations are
# sealed in evidence/E005/PREREGISTRATION.md, committed before the first run.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/x86-reproduction.yml
      - harness/**
      - evidence/E005/PREREGISTRATION.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run E005 legs
        run: bash harness/ci_x86.sh
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e005-x86-evidence
          path: evidence/E005/ci/
          retention-days: 90
